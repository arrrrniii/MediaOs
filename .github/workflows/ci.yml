name: CI

on:
  push:
    branches: [main, production, 'feature/**']
  pull_request:

jobs:
  worker-tests:
    name: Worker unit + integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  worker-e2e:
    name: Worker against real Postgres/Redis/MinIO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediaos
          POSTGRES_USER: mediaos
          POSTGRES_PASSWORD: test_pg_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mediaos"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: bitnami/minio:2024
        env:
          MINIO_ROOT_USER: mvadmin
          MINIO_ROOT_PASSWORD: test_minio_password
        ports: ['9000:9000']
    env:
      PG_HOST: localhost
      PG_DATABASE: mediaos
      PG_USER: mediaos
      PG_PASSWORD: test_pg_password
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: mvadmin
      MINIO_SECRET_KEY: test_minio_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Run migrations against real Postgres
        run: npm run migrate
      - name: Verify migrations
        run: npm run migrate -- --verify
      # Real-services integration suite lands in Phase 11; migrations are
      # exercised here so schema changes fail fast.

  dashboard:
    name: Dashboard lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sdk:
    name: SDK build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit worker
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high
      - name: Audit dashboard
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: Audit SDK
        working-directory: sdk
        run: npm audit --omit=dev --audit-level=high
