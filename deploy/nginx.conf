# MediaOS — Nginx reverse proxy with origin cache
# Single domain setup: cdn.yourdomain.com handles both API and Dashboard
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/mediaos
#   2. Replace cdn.yourdomain.com with your domain
#   3. sudo mkdir -p /var/cache/nginx/mediaos_originals /var/cache/nginx/mediaos_transforms
#   4. ln -s /etc/nginx/sites-available/mediaos /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# For SSL, use certbot:
#   sudo certbot --nginx -d cdn.yourdomain.com

# Cache zones — place this in http {} block or in a conf.d snippet
proxy_cache_path /var/cache/nginx/mediaos_originals
    levels=1:2 keys_zone=media_originals:20m
    max_size=5g inactive=30d use_temp_path=off;

proxy_cache_path /var/cache/nginx/mediaos_transforms
    levels=1:2 keys_zone=media_transforms:40m
    max_size=10g inactive=30d use_temp_path=off;

# ── Access log for lifecycle tracking ────────────────────────────────────────
# Requests served straight from the edge cache never reach the worker, so the
# per-file access tracker never sees them. The worker's access-log importer
# (src/services/accessLogImporter.js) parses THIS log to record those cached
# hits into access_daily / files.last_accessed_at, keeping the lifecycle
# scanner from flagging a hot-but-cached file as cold.
#
# Tab-separated so the importer can split reliably; field order MUST stay:
#   $time_iso8601  $status  $body_bytes_sent  $request_method  $uri
# Place this log_format in the http {} block (alongside the cache zones).
log_format mediaos_access '$time_iso8601\t$status\t$body_bytes_sent\t$request_method\t$uri';
#
# Import it incrementally (idempotent; remembers its byte offset). Run from cron
# or a systemd timer on the worker host, e.g. every 5 minutes:
#   */5 * * * *  cd /opt/mediaos/worker && node src/services/accessLogImporter.js /var/log/nginx/mediaos_access.log

server {
    listen 80;
    server_name cdn.yourdomain.com;

    client_max_body_size 100M;

    # API routes → Worker (no cache)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file uploads
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # CDN file serving → Worker (cached at edge)
    location /f/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lifecycle access log — includes cache HITs the worker never sees.
        access_log /var/log/nginx/mediaos_access.log mediaos_access;

        # Origin cache for originals
        proxy_cache media_originals;
        proxy_cache_key $host$uri$is_args$args;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 403 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;

        # Signed / private requests never touch the cache — a stored copy would
        # keep being served after the token expires. The worker also answers
        # these with "Cache-Control: private, no-store"; we deliberately do NOT
        # set "proxy_ignore_headers Cache-Control", so nginx honors that too.
        proxy_cache_bypass $arg_token $arg_expires $http_authorization;
        proxy_no_cache     $arg_token $arg_expires $http_authorization;

        # Pass cache status header downstream (useful for debugging)
        add_header X-Cache-Status $upstream_cache_status;

        # Allow large files to be buffered
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 1024m;
    }

    # Image resizing → Worker (cached at edge)
    location /img/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lifecycle access log — includes cache HITs the worker never sees.
        access_log /var/log/nginx/mediaos_access.log mediaos_access;

        # Origin cache for transforms
        proxy_cache media_transforms;
        proxy_cache_key $host$uri$is_args$args;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 400 404 403 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;

        # Signed transforms bypass the cache entirely (see /f/ above).
        proxy_cache_bypass $arg_token $arg_expires $http_authorization;
        proxy_no_cache     $arg_token $arg_expires $http_authorization;

        add_header X-Cache-Status $upstream_cache_status;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 256k;
    }

    # Health check → Worker
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Everything else → Dashboard
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js HMR in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Optional: separate cookie-free media domain ──────────────────────────────
#
# Serving user-uploaded files from the same origin as the dashboard means any
# content that does manage to execute runs with the dashboard's cookies. Putting
# media on its own domain removes that class of problem: this block proxies only
# /f/ and /img/, strips the Cookie header on the way in, and drops Set-Cookie on
# the way out. Nothing else is reachable on it.
#
# After enabling it, point the worker at it so generated URLs use the new host:
#   PUBLIC_URL=https://media.example.com   (or MEDIA_URL, if configured
#   separately from the API's public URL)
# The dashboard and API keep using the main domain above.
